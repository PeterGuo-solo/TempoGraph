[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempograph"
version = "0.1.0"
description = "TempoGraph: hierarchical choreography graphs with boundary fusion"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "torchdiffeq>=0.2.4",
  "torchcfm>=1.0",
  "scipy>=1.10",
]
audio = [
  "librosa>=0.10",
  "allin1>=1.1",
]
body = [
  "smplx>=0.1.28",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
tempograph = "tempograph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
