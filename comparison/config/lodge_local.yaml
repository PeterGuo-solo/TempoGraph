DEVICE:
- 3
- 4
- 5
- 6
- 7
SEED_VALUE: 1233
Norm: true
Discriminator: true
DEBUG: false
FineTune: true
TRAIN:
  STAGE: diffusion
  SPLIT: train
  NUM_WORKERS: 16
  BATCH_SIZE: 190
  START_EPOCH: 1
  END_EPOCH: 1601
  RESUME: ''
