  DATASETS:
  - FINEDANCE_139CUT
  OPTIM:
    TYPE: Adan
    LR: 0.0004
  ABLATION:
    VAE_TYPE: 'no'
    VAE_ARCH: encoder_decoder
    PE_TYPE: actor
    DIFF_PE_TYPE: actor
    SKIP_CONNECT: false
    MLP_DIST: false
    IS_DIST: false
    PREDICT_EPSILON: false
EVAL:
  SPLIT: gtest
  BATCH_SIZE: 256
  NUM_WORKERS: 16
TEST:
  TEST_DIR: ''
  CHECKPOINTS: ''
  SPLIT: gtest
  BATCH_SIZE: 256
  NUM_WORKERS: 12
  SAVE_PREDICTIONS: true
  COUNT_TIME: false
  REPLICATION_TIMES: 2
  MM_NUM_SAMPLES: 100
  MM_NUM_REPEATS: 30
  MM_NUM_TIMES: 10
  DIVERSITY_TIMES: 300
  REP_I: 0
  DATASETS:
  - FINEDANCE_139CUT
  FOLDER: ./experiments
model:
  target: modules
  vae_type: 'no'
  vae: true
  model_type: Local_Module
  condition: music
  latent_dim:
  - 1
  - 256
  ff_size: 1024
  num_layers: 9
  num_head: 4
  droupout: 0.1
  activation: gelu
  guidance_scale: 7.5
  guidance_uncondp: 0.1
  diffusion:
    target: dld.models.architectures.diffusion.GaussianDiffusion
    params:
      horizon: ${FINEDANCE.full_seq_len}
      repr_dim: ${FINEDANCE.nfeats}
      schedule: cosine
      n_timestep: 1000
      predict_epsilon: false
      loss_type: l2
      use_p2: false
      cond_drop_prob: 0.25
      guidance_weight: 2
  DanceDecoder:
    target: dld.models.architectures.model.Refine_DanceDecoder
    params:
      nfeats: ${FINEDANCE.nfeats}
      seq_len: ${FINEDANCE.full_seq_len}
      latent_dim: 512
      ff_size: 1024
      num_layers: 8
      num_heads: 8
      dropout: 0.1
      cond_feature_dim: 35
      activation: gelu
  DanceDiscriminator:
    target: dld.models.architectures.model.DanceDiscriminator
    params:
      nfeats: ${FINEDANCE.nfeats}
      seq_len: ${FINEDANCE.full_seq_len}
      latent_dim: 512
      ff_size: 1024
      num_layers: 8
      num_heads: 8
      dropout: 0.1
      cond_feature_dim: 35
      activation: gelu
LOSS:
  TYPE: smpl_loss_relative
  LAMBDA_MSE: 0.636
  LAMBDA_V: 2.964
  LAMBDA_FK: 1
  LAMBDA_FK_V: 0
  LAMBDA_FK_A: 0
  LAMBDA_FOOT: 10
  LAMBDA_FC: 0
  LAMBDA_TRANS: 0.5
  LAMBDA_DIS: 0.1
  DIST_SYNC_ON_STEP: true
METRIC:
